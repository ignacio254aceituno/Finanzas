  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; overflow: hidden; }
    body { font-family: 'DM Sans', sans-serif; background: #0a0a0f; color: #f0f0f5; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    input, select, button { font-family: inherit; outline: none; border: none; -webkit-appearance: none; }
    button { cursor: pointer; }
    ::-webkit-scrollbar { display: none; }

    #header { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:12px 18px; background:rgba(10,10,15,.96); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid #1a1a2a; z-index:50; }
    .logo { display:flex; align-items:center; gap:9px; }
    .logo-icon { width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#6ee7b7,#3b82f6); display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; color:#fff; }
    .logo-text { font-weight:700; font-size:17px; letter-spacing:-.03em; }
    #month-input { background:#16161e; border:1px solid #2a2a3a; color:#aaa; border-radius:8px; padding:6px 10px; font-size:12px; font-family:'DM Mono',monospace; }

    #content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px 24px; }

    #nav { flex-shrink:0; display:flex; background:rgba(14,14,20,.98); border-top:1px solid #1a1a2a; padding-bottom:calc(env(safe-area-inset-bottom) + 4px); }
    .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:8px 1px; background:none; color:#555; font-size:8px; letter-spacing:.01em; font-weight:600; transition:color .15s; line-height:1.1; text-align:center; }
    .nav-btn.active { color:#a78bfa; }
    .nav-btn svg { width:20px; height:20px; }
    .nav-add-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:6px 2px; background:none; }
    .nav-add-inner { width:42px; height:42px; border-radius:13px; background:linear-gradient(135deg,#a78bfa,#6366f1); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:300; color:#fff; box-shadow:0 4px 18px rgba(99,102,241,.4); transition:transform .15s; }
    .nav-add-btn:active .nav-add-inner { transform:scale(.92); }

    #bg-particles { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
    #loading-screen, #lock-screen, #header, #content, nav#nav, #modal-overlay, #toast { position:relative; z-index:1; }

    .card { background:#16161e; border:1px solid #2a2a3a; border-radius:16px; padding:20px; margin-bottom:14px; animation:slideUp .3s cubic-bezier(.22,1,.36,1) both; transition:transform .15s ease; }
    .card:active { transform:scale(.985); }
    .debt-card, .receivable-card { transition:transform .18s cubic-bezier(.22,1,.36,1), box-shadow .18s ease, border-color .18s ease; }
    .debt-card:active, .receivable-card:active { transform:scale(.97); }
    .select-pulse { animation:selectPulse .45s cubic-bezier(.22,1,.36,1); }
    @keyframes selectPulse {
      0%   { box-shadow:0 0 0 0 rgba(74,222,128,.55); }
      60%  { box-shadow:0 0 0 14px rgba(74,222,128,0); }
      100% { box-shadow:0 0 0 0 rgba(74,222,128,0); }
    }
    .view-enter { animation:viewEnter .38s cubic-bezier(.22,1,.36,1) both; }
    @keyframes viewEnter {
      from { opacity:0; transform:translateY(10px) scale(.985); filter:blur(3px); }
      to   { opacity:1; transform:none; filter:blur(0); }
    }
    @keyframes slideUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes toastIn { from { opacity:0; transform:translateY(10px) scale(.95); } to { opacity:1; transform:none; } }
    .section-label { font-size:11px; color:#555; letter-spacing:.08em; text-transform:uppercase; margin-bottom:12px; font-weight:600; }

    #balance-card { border-radius:18px; padding:22px; margin-bottom:14px; position:relative; overflow:hidden; animation:slideUp .3s cubic-bezier(.22,1,.36,1) both, auroraShift 9s ease-in-out infinite; background-size:180% 180%; transition:transform .15s ease; }
    #balance-card:active { transform:scale(.99); }
    @keyframes auroraShift { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
    #balance-card .glow { position:absolute; top:-30px; right:-30px; width:140px; height:140px; border-radius:50%; pointer-events:none; }
    #balance-label { font-size:11px; color:#666; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
    #balance-amount { font-family:'DM Mono',monospace; font-size:34px; font-weight:700; letter-spacing:-.04em; margin-bottom:16px; }
    .balance-row { display:flex; gap:16px; }
    .balance-stat { flex:1; }
    .balance-stat-label { font-size:10px; letter-spacing:.07em; margin-bottom:3px; font-weight:600; }
    .balance-stat-val { font-family:'DM Mono',monospace; font-size:14px; font-weight:500; }

    .dist-bar-track { height:8px; border-radius:8px; background:#1e1e2e; overflow:hidden; display:flex; margin-bottom:8px; }
    .dist-bar-in { background:linear-gradient(90deg,#34d399,#4ade80); transition:width .6s ease; }
    .dist-bar-out { flex:1; background:linear-gradient(90deg,#f87171,#ef4444); }
    .dist-labels { display:flex; justify-content:space-between; font-size:12px; }

    .cat-row { margin-bottom:12px; }
    .cat-row-top { display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; }
    .cat-bar-track { height:5px; border-radius:5px; background:#1e1e2e; }
    .cat-bar-fill { height:100%; border-radius:5px; background:linear-gradient(90deg,#6366f1,#a78bfa); transition:width .5s ease; }

    .tx-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #1a1a2a; }
    .tx-row:last-child { border-bottom:none; }
    .tx-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0; }
    .tx-info { flex:1; min-width:0; }
    .tx-desc { font-weight:500; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tx-sub { font-size:12px; color:#555; margin-top:2px; }
    .tx-amount { font-family:'DM Mono',monospace; font-weight:600; font-size:15px; flex-shrink:0; }
    .tx-del { background:none; color:#333; font-size:18px; padding:4px 4px 4px 8px; }

    .form-label { font-size:11px; color:#666; letter-spacing:.06em; text-transform:uppercase; display:block; margin-bottom:8px; font-weight:600; }
    .form-input { width:100%; background:#0a0a0f; border:1px solid #2a2a3a; border-radius:12px; padding:13px 14px; color:#f0f0f5; font-size:16px; font-family:'DM Sans',sans-serif; }
    .form-input:focus { border-color:#4c3d9a; }
    .type-toggle { display:flex; background:#0a0a0f; border-radius:12px; padding:4px; border:1px solid #1e1e2e; margin-bottom:20px; }
    .type-btn { flex:1; padding:11px; border-radius:9px; font-weight:700; font-size:15px; transition:all .2s; background:transparent; color:#555; }
    .type-btn.active-in { background:rgba(74,222,128,.15); color:#4ade80; border:1px solid #1a5c35; }
    .type-btn.active-out { background:rgba(248,113,113,.15); color:#f87171; border:1px solid #5c1a1a; }
    .cats-wrap { display:flex; flex-wrap:wrap; gap:8px; }
    .cat-btn { padding:8px 13px; border-radius:9px; font-size:13px; font-weight:500; background:#0a0a0f; color:#555; border:1px solid #1a1a2a; transition:all .15s; }
    .cat-btn.selected { background:#1e1e3a; color:#a78bfa; border-color:#4c3d9a; }
    .submit-btn { width:100%; padding:16px; border-radius:14px; font-weight:700; font-size:17px; color:#fff; letter-spacing:-.01em; box-shadow:0 8px 24px rgba(0,0,0,.4); transition:transform .1s; }
    .submit-btn:active { transform:scale(.97); }

    .hist-card { background:#16161e; border:1px solid #2a2a3a; border-radius:14px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:12px; animation:slideUp .25s cubic-bezier(.22,1,.36,1) both; transition:transform .15s ease; }
    .hist-card:active { transform:scale(.98); }

    /* SAVINGS */
    .goal-card { background:#16161e; border:1px solid #2a2a3a; border-radius:16px; padding:18px; margin-bottom:12px; animation:slideUp .3s cubic-bezier(.22,1,.36,1) both; transition:transform .15s ease; }
    .goal-card:active { transform:scale(.98); }
    .goal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .goal-name { font-weight:700; font-size:15px; }
    .goal-progress-track { height:8px; border-radius:8px; background:#1e1e2e; margin-bottom:8px; overflow:hidden; }
    .goal-progress-fill { height:100%; border-radius:8px; transition:width .6s cubic-bezier(.22,1,.36,1); }
    .goal-amounts { display:flex; justify-content:space-between; font-size:12px; color:#666; margin-bottom:10px; }
    .goal-amount-val { font-family:'DM Mono',monospace; font-size:13px; }
    .goal-actions { display:flex; gap:8px; }
    .goal-btn { flex:1; padding:8px; border-radius:9px; font-size:13px; font-weight:600; background:#1e1e2e; color:#a78bfa; border:1px solid #2a2a3a; transition:all .15s; }
    .goal-btn:active { transform:scale(.96); }
    .goal-del-btn { padding:8px 12px; border-radius:9px; font-size:13px; background:#1e1e2e; color:#555; border:1px solid #2a2a3a; }

    /* DEBTS */
    .debt-card { border-radius:16px; padding:16px; margin-bottom:12px; animation:slideUp .3s cubic-bezier(.22,1,.36,1) both; display:flex; align-items:center; gap:14px; transition:transform .15s ease; }
    .debt-card:active { transform:scale(.98); }
    .animated-list-scroll { max-height:420px; overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:#333 transparent; mask-image:linear-gradient(to bottom, transparent, black 22px, black calc(100% - 22px), transparent); -webkit-mask-image:linear-gradient(to bottom, transparent, black 22px, black calc(100% - 22px), transparent); padding-top:4px; }
    .animated-list-scroll::-webkit-scrollbar { width:5px; }
    .animated-list-scroll::-webkit-scrollbar-thumb { background:#333; border-radius:10px; }
    .debt-card.list-focused { outline:2px solid #4ade80; outline-offset:2px; }
    .monthly-stack-card { transition:transform .18s ease, filter .18s ease, opacity .18s ease; }
    .gradual-blur-wrap { position:relative; height:480px; overflow:hidden; border-radius:14px; }
    .gradual-blur-scroll { height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .gradual-blur-layers { position:absolute; left:0; right:0; bottom:0; height:7rem; pointer-events:none; z-index:3; }
    .gradual-blur-layer { position:absolute; inset:0; }
    .gradual-blur-layer:nth-child(1){ backdrop-filter:blur(1px); -webkit-backdrop-filter:blur(1px); mask-image:linear-gradient(to top, black 0%, transparent 20%); -webkit-mask-image:linear-gradient(to top, black 0%, transparent 20%); }
    .gradual-blur-layer:nth-child(2){ backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); mask-image:linear-gradient(to top, black 0%, transparent 35%); -webkit-mask-image:linear-gradient(to top, black 0%, transparent 35%); }
    .gradual-blur-layer:nth-child(3){ backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); mask-image:linear-gradient(to top, black 0%, transparent 55%); -webkit-mask-image:linear-gradient(to top, black 0%, transparent 55%); }
    .gradual-blur-layer:nth-child(4){ backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); mask-image:linear-gradient(to top, black 0%, transparent 75%); -webkit-mask-image:linear-gradient(to top, black 0%, transparent 75%); }
    .gradual-blur-layer:nth-child(5){ backdrop-filter:blur(11px); -webkit-backdrop-filter:blur(11px); mask-image:linear-gradient(to top, black 0%, transparent 100%); -webkit-mask-image:linear-gradient(to top, black 0%, transparent 100%); }
    .debt-check { width:28px; height:28px; border-radius:50%; border:2px solid #333; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; font-size:14px; }
    .debt-check.paid { background:#1a4030; border-color:#4ade80; }
    .debt-info { flex:1; min-width:0; }
    .debt-name { font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .debt-sub { font-size:12px; color:#555; margin-top:3px; }

    /* CELEBRACIÓN AL MARCAR CHECKLIST */
    .checkbox-pop { animation: checkboxPop .45s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes checkboxPop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.35) rotate(-8deg); }
      60%  { transform: scale(0.9) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .check-particle {
      position: fixed; font-size: 15px; pointer-events: none; z-index: 9998;
      transform: translate(-50%,-50%) scale(.4); opacity: 1;
      animation: checkParticleFly .75s cubic-bezier(.22,.61,.36,1) forwards;
      filter: drop-shadow(0 0 4px rgba(74,222,128,.6));
    }
    @keyframes checkParticleFly {
      0%   { transform: translate(-50%,-50%) scale(.3) rotate(0deg); opacity: 1; }
      25%  { transform: translate(-50%,-50%) scale(1.15) rotate(10deg); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.6) rotate(30deg); opacity: 0; }
    }
    .check-ring {
      position: fixed; width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid #4ade80; pointer-events: none; z-index: 9997;
      transform: translate(-50%,-50%) scale(1); opacity: .85;
      animation: checkRingPulse .55s ease-out forwards;
    }
    @keyframes checkRingPulse {
      0%   { transform: translate(-50%,-50%) scale(.8); opacity: .9; }
      100% { transform: translate(-50%,-50%) scale(2.6); opacity: 0; }
    }
    .debt-right { text-align:right; flex-shrink:0; }
    .debt-amount { font-family:'DM Mono',monospace; font-weight:700; font-size:16px; }
    .debt-due { font-size:11px; margin-top:3px; }

    /* DEBT SUMMARY BAR */
    .debt-summary { display:flex; gap:10px; margin-bottom:14px; }
    .debt-stat { flex:1; background:#16161e; border:1px solid #2a2a3a; border-radius:14px; padding:14px; text-align:center; animation:slideUp .3s cubic-bezier(.22,1,.36,1) both; }
    .debt-stat-label { font-size:10px; color:#555; letter-spacing:.06em; text-transform:uppercase; margin-bottom:5px; font-weight:600; }
    .debt-stat-val { font-family:'DM Mono',monospace; font-size:17px; font-weight:700; }

    /* FORECAST */
    .forecast-bar-wrap { display:flex; align-items:flex-end; gap:6px; height:80px; margin:12px 0 6px; }
    .forecast-bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
    .forecast-bar { width:100%; border-radius:6px 6px 2px 2px; min-height:4px; transition:height .5s ease; }
    .forecast-bar-label { font-size:9px; color:#555; letter-spacing:.04em; text-align:center; }
    .forecast-bar-val { font-size:10px; font-family:'DM Mono',monospace; color:#888; text-align:center; }

    #modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:200; align-items:center; justify-content:center; animation:fadeIn .2s; }
    #modal-overlay.show { display:flex; }
    #modal-box { background:#16161e; border:1px solid #2a2a3a; border-radius:18px; padding:24px 20px; max-width:320px; width:92%; max-height:88dvh; overflow-y:auto; }
    .modal-title { font-size:17px; font-weight:700; margin-bottom:16px; }
    .modal-row { margin-bottom:14px; }
    .modal-btns { display:flex; gap:10px; margin-top:20px; }
    .modal-cancel { flex:1; padding:11px; border-radius:10px; background:#222; color:#888; font-size:15px; }
    .modal-confirm { flex:1; padding:11px; border-radius:10px; font-size:15px; font-weight:700; color:#fff; }
    .modal-confirm.danger { background:#7f2020; }
    .modal-confirm.primary { background:linear-gradient(135deg,#6366f1,#a78bfa); }

    #toast { display:none; position:fixed; bottom:calc(80px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); padding:10px 20px; border-radius:10px; font-size:14px; font-weight:500; box-shadow:0 8px 28px rgba(0,0,0,.5); z-index:300; white-space:nowrap; animation:toastIn .3s ease; }
    #toast.show { display:block; }
    #toast.ok { background:#0d2d1a; border:1px solid #1a5c35; color:#4ade80; }
    #toast.err { background:#3d1414; border:1px solid #7f2020; color:#ff8080; }

    .empty { text-align:center; padding:36px 20px; color:#444; }
    .empty-icon { font-size:40px; margin-bottom:12px; }
    .insight { display:flex; align-items:flex-start; gap:10px; background:#0f1a2a; border:1px solid #1a3050; border-radius:12px; padding:13px 14px; margin-bottom:10px; }
    .insight-icon { font-size:20px; flex-shrink:0; margin-top:1px; }
    .insight-text { font-size:13px; color:#8ab4d4; line-height:1.5; }
    .insight-text strong { color:#b8d4f0; }

    /* TICKER */
    #ticker-wrap { flex-shrink:0; overflow:hidden; background:#0f0a1a; border-bottom:1px solid #2a1a4a; height:0; transition:height .3s ease; display:flex; align-items:center; }
    #ticker-wrap.visible { height:28px; }
    #ticker-wrap.urgent { background:#1a0808; border-bottom-color:#4a1a1a; }
    #ticker-track { display:flex; white-space:nowrap; animation:tickerScroll 28s linear infinite; will-change:transform; }
    #ticker-track:hover { animation-play-state:paused; }
    @keyframes tickerScroll { 0% { transform:translateX(0); } 100% { transform:translateX(-50%); } }
    .ticker-item { display:inline-flex; align-items:center; gap:6px; padding:0 28px; font-size:11px; font-weight:600; letter-spacing:.03em; }
    .ticker-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
    .ticker-sep { color:#333; padding:0 8px; font-size:14px; }
    #ticker-bell { flex-shrink:0; padding:0 10px; font-size:14px; cursor:pointer; border-left:1px solid #2a1a4a; height:100%; display:flex; align-items:center; background:none; transition:background .15s; }
    #ticker-bell:hover { background:rgba(255,255,255,.05); }
    #ticker-bell.on { color:#a78bfa; }
    #ticker-bell.off { color:#444; }
  
    #lock-screen { position:fixed; inset:0; background:#0a0a0f; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px; }
    #lock-screen.hidden { display:none; }
    #lock-icon { width:60px; height:60px; border-radius:18px; background:linear-gradient(135deg,#6ee7b7,#3b82f6); display:flex; align-items:center; justify-content:center; font-size:30px; }
    #lock-input { background:#16161e; border:1px solid #2a2a3a; border-radius:12px; padding:14px 18px; color:#fff; font-size:18px; text-align:center; width:240px; letter-spacing:4px; }
    #lock-btn, .lock-action-btn { background:linear-gradient(135deg,#6366f1,#a78bfa); color:#fff; border:none; border-radius:12px; padding:13px 30px; font-size:15px; font-weight:700; }
    #lock-error { color:#f87171; font-size:13px; height:16px; }
    .lock-field { background:#16161e; border:1px solid #2a2a3a; border-radius:12px; padding:14px 18px; color:#fff; font-size:16px; text-align:center; width:240px; }
    .lock-view { display:none; flex-direction:column; align-items:center; gap:14px; }
    .lock-hint { color:#999; font-size:13px; text-align:center; max-width:260px; }
    .lock-link { color:#666; font-size:12px; text-decoration:underline; cursor:pointer; }

    #loading-screen { position:fixed; inset:0; background:#0a0a0f; z-index:10000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; transition:opacity .5s ease; overflow:hidden; }
    #loading-screen.fade-out { opacity:0; pointer-events:none; }

    /* Partículas que suben y forman el logo (desintegración al revés) */
    #rise-particles { position:absolute; inset:0; z-index:1; overflow:hidden; pointer-events:none; }
    .particle { position:absolute; bottom:38%; width:5px; height:5px; border-radius:50%; opacity:0; animation-name:particleRise; animation-timing-function:cubic-bezier(.2,.7,.3,1); animation-fill-mode:forwards; }
    @keyframes particleRise {
      0%   { transform:translateY(0) scale(.4); opacity:0; }
      12%  { opacity:1; }
      75%  { opacity:.9; }
      100% { transform:translateY(-190px) scale(1); opacity:0; }
    }

    /* Logo ensamblándose de abajo hacia arriba */
    #loading-logo-wrap { position:relative; width:150px; height:150px; display:flex; align-items:center; justify-content:center; z-index:3; }
    #loading-logo-img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 0 20px rgba(163,196,106,.45)); clip-path:inset(100% 0 0 0); opacity:0; animation:logoReveal 2.6s cubic-bezier(.22,.9,.28,1) forwards; }
    @keyframes logoReveal {
      0%   { clip-path:inset(100% 0 0 0); opacity:0; transform:translateY(16px) scale(.93); }
      12%  { opacity:1; }
      100% { clip-path:inset(0% 0 0 0); opacity:1; transform:translateY(0) scale(1); }
    }

    #loading-text { color:#d4a72c; font-size:13px; letter-spacing:.15em; font-weight:600; z-index:3; opacity:0; animation:fadeIn .6s ease forwards; animation-delay:2.4s; }
    #loading-sub { color:#555; font-size:11px; letter-spacing:.1em; z-index:3; opacity:0; animation:fadeIn .6s ease forwards; animation-delay:2.6s; }

    /* Logro final: billetes y confeti saliendo de abajo hacia arriba */
    #achievement-wrap { position:absolute; inset:0; z-index:4; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; }
    #loading-screen.phase2 #achievement-wrap { animation:achievementIn .55s cubic-bezier(.34,1.56,.64,1) forwards; }
    @keyframes achievementIn { 0%{opacity:0;transform:scale(.4);} 60%{opacity:1;transform:scale(1.12);} 100%{opacity:1;transform:scale(1);} }
    #achievement-badge { display:flex; flex-direction:column; align-items:center; gap:6px; }
    #achievement-icon { font-size:52px; filter:drop-shadow(0 0 16px rgba(212,167,44,.6)); }
    #achievement-label { color:#d4a72c; font-size:13px; font-weight:700; letter-spacing:.06em; }

    .bill2, .confetti { position:absolute; bottom:30%; opacity:0; z-index:2; pointer-events:none; }
    .bill2 { font-size:24px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
    .confetti { width:8px; height:12px; border-radius:2px; }
    #loading-screen.phase2 .bill2 { animation-name:billRiseBurst; animation-timing-function:ease-out; animation-fill-mode:forwards; }
    #loading-screen.phase2 .confetti { animation-name:confettiBurst; animation-timing-function:ease-out; animation-fill-mode:forwards; }
    @keyframes billRiseBurst {
      0%   { transform:translateY(0) rotate(0deg); opacity:0; }
      10%  { opacity:1; }
      60%  { transform:translateY(-170px) rotate(180deg); opacity:1; }
      100% { transform:translateY(-250px) rotate(340deg); opacity:0; }
    }
    @keyframes confettiBurst {
      0%   { transform:translate(0,0) rotate(0deg); opacity:0; }
      8%   { opacity:1; }
      55%  { transform:translate(var(--dx,20px),-150px) rotate(220deg); opacity:1; }
      100% { transform:translate(calc(var(--dx,20px)*1.6),-40px) rotate(520deg); opacity:0; }
    }

<script>
const CATS = {
  ingreso: ["Salario","Freelance","Inversiones","Alquiler","Regalo","Otro ingreso"],
  gasto:   ["Alimentación","Transporte","Vivienda","Salud","Entretenimiento","Ropa","Educación","Servicios","Otro gasto"]
};
const ICONS = {
  Salario:"💼",Freelance:"💻",Inversiones:"📈",Alquiler:"🏠",Regalo:"🎁","Otro ingreso":"💰",
  Alimentación:"🍽️",Transporte:"🚗",Vivienda:"🏡",Salud:"❤️",Entretenimiento:"🎬",
  Ropa:"👗",Educación:"📚",Servicios:"💡","Otro gasto":"📦"
};
const GOAL_EMOJIS = ["🏖️","🚗","🏠","💻","✈️","🎓","💍","🏋️","🐶","🎸","📱","🛋️","💰","🎯"];

function load(k,def){ try{ return JSON.parse(localStorage.getItem(k)||"null")??def; }catch{ return def; } }
function save(k,v){ localStorage.setItem(k,JSON.stringify(v)); }

let transactions = load("fin_tx",[]);
let goals        = load("fin_goals",[]);
// debt: {id, name, total, paid, vencimiento, categoria, pagos:[{date,amount}]}
let debts        = load("fin_debts",[]);
let monthlyDebts = load("fin_monthly_debts",[]); // {id, name, amount, categoria, pagado}
let receivables  = load("fin_receivables",[]); // {id, name, total, paid, nota, vencimiento, cobros}
let customCats   = load("fin_custom_cats",{ingreso:[],gasto:[]}); // {ingreso:[{name,icon}], gasto:[{name,icon}]}
let bankRecords  = load("fin_bank_records",[]); // movimientos reales traídos de Fintoc (solo lectura desde la app)
let bankAccounts = load("fin_bank_accounts",[]); // saldos reales de cuentas/tarjetas traídos de Fintoc
let debtsSubTab  = "debo"; // "debo" | "medeben"

function getCats(tipo){ return [...CATS[tipo], ...customCats[tipo].map(c=>c.name)]; }
function catIcon(tipo,name){
  if(ICONS[name]) return ICONS[name];
  const c=customCats[tipo].find(c=>c.name===name);
  return c ? c.icon : "🏷️";
}

let currentView = "dashboard";
let form = { tipo:"gasto", descripcion:"", monto:"", categoria:"Alimentación", fecha:todayStr() };
let modalAction = null, modalData = {};

function todayStr(){ return new Date().toISOString().slice(0,10); }
function thisMonth(){ return new Date().toISOString().slice(0,7); }
function fmt(n){ return new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",minimumFractionDigits:0,maximumFractionDigits:0}).format(Math.round(n)); }
function animateNumber(el,from,to,duration){
  if(!el) return;
  duration=duration||700;
  const start=performance.now();
  const diff=to-from;
  function step(now){
    const p=Math.min((now-start)/duration,1);
    const eased=1-Math.pow(1-p,3);
    el.textContent=fmt(from+diff*eased);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function fmtShort(n){ return Math.abs(n)>=1000?"$"+(n/1000).toFixed(1)+"k":"$"+Math.round(n); }
function fmtDate(d){ return new Date(d+"T12:00:00").toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"numeric"}); }
function monthLabel(o){ const d=new Date(); d.setMonth(d.getMonth()+o); return d.toLocaleDateString("es-MX",{month:"short"}).toUpperCase(); }

const monthInput = document.getElementById("month-input");
monthInput.value = thisMonth();
monthInput.addEventListener("change",()=>render());

// TOAST
let toastTimer;
function showToast(msg,type="ok"){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className=`show ${type}`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.className=""; },2800);
}

// MODAL
function openModal(title,bodyHtml,confirmLabel,confirmClass,action,data){
  modalAction=action; modalData=data||{};
  document.getElementById("modal-title").textContent=title;
  document.getElementById("modal-body").innerHTML=bodyHtml;
  const cb=document.getElementById("modal-confirm-btn");
  cb.textContent=confirmLabel; cb.className="modal-confirm "+(confirmClass||"primary");
  document.getElementById("modal-overlay").classList.add("show");
}
function closeModal(){ modalAction=null; modalData={}; document.getElementById("modal-overlay").classList.remove("show"); }

function modalConfirm(){
  if(modalAction==="deleteGoal"){
    goals=goals.filter(g=>g.id!==modalData.id); save("fin_goals",goals); syncToCloud();
    showToast("Meta eliminada","err"); closeModal(); render();
  } else if(modalAction==="deleteTx"){
    transactions=transactions.filter(t=>t.id!==modalData.id); save("fin_tx",transactions); syncToCloud();
    showToast("Transacción eliminada","err"); closeModal(); render();
  } else if(modalAction==="deleteDebt"){
    debts=debts.filter(d=>d.id!==modalData.id); save("fin_debts",debts); syncToCloud();
    showToast("Deuda eliminada","err"); closeModal(); render(); renderTicker();
  } else if(modalAction==="addGoal"){
    const name=document.getElementById("mg-name")?.value.trim();
    const target=parseFloat(document.getElementById("mg-target")?.value);
    const emoji=modalData.emoji||"💰";
    if(!name||isNaN(target)||target<=0){ showToast("Completa todos los campos","err"); return; }
    goals.push({id:Date.now(),name,emoji,target,saved:0,deposits:[]});
    save("fin_goals",goals); syncToCloud(); showToast("Meta creada ✓"); closeModal(); render();
  } else if(modalAction==="deposit"){
    const amount=parseFloat(document.getElementById("mg-deposit")?.value);
    if(isNaN(amount)||amount<=0){ showToast("Monto inválido","err"); return; }
    const g=goals.find(g=>g.id===modalData.id);
    if(g){ g.saved=(g.saved||0)+amount; g.deposits=g.deposits||[]; g.deposits.push({date:todayStr(),amount}); if(g.saved>=g.target) showToast("🎉 ¡Meta alcanzada!"); else showToast(`Depósito de ${fmt(amount)} registrado ✓`); }
    save("fin_goals",goals); syncToCloud(); closeModal(); render();
  } else if(modalAction==="withdraw"){
    const amount=parseFloat(document.getElementById("mg-deposit")?.value);
    const g=goals.find(g=>g.id===modalData.id);
    if(isNaN(amount)||amount<=0||amount>(g?.saved||0)){ showToast("Monto inválido","err"); return; }
    if(g){ g.saved-=amount; g.deposits.push({date:todayStr(),amount:-amount}); }
    save("fin_goals",goals); syncToCloud(); showToast("Retiro registrado"); closeModal(); render();
  } else if(modalAction==="addDebt"){
    const name=document.getElementById("d-name")?.value.trim();
    const total=parseFloat(document.getElementById("d-total")?.value);
    const venc=document.getElementById("d-venc")?.value||"";
    const cat=document.getElementById("d-cat")?.value||"General";
    if(!name||isNaN(total)||total<=0){ showToast("Completa nombre y monto","err"); return; }
    debts.push({id:Date.now(),name,total,paid:0,vencimiento:venc,categoria:cat,pagos:[]});
    save("fin_debts",debts); syncToCloud(); showToast("Deuda agregada ✓"); closeModal(); render(); renderTicker();
  } else if(modalAction==="addMonthlyDebt"){
    const name=document.getElementById("md-name")?.value.trim();
    const amount=parseFloat(document.getElementById("md-amount")?.value);
    const cat=document.getElementById("md-cat")?.value||"Otro";
    if(!name||isNaN(amount)||amount<=0){ showToast("Completa todos los campos","err"); return; }
    monthlyDebts.push({id:Date.now(),name,amount,categoria:cat,pagado:false});
    save("fin_monthly_debts",monthlyDebts); syncToCloud();
    showToast("Deuda del mes agregada ✓"); closeModal(); render();
  } else if(modalAction==="payDebt"){
    const amount=parseFloat(document.getElementById("d-pay")?.value);
    const d=debts.find(d=>d.id===modalData.id);
    const remaining=d ? d.total-d.paid : 0;
    if(isNaN(amount)||amount<=0||amount>remaining+0.01){ showToast("Monto inválido","err"); return; }

    save("fin_debts",debts); syncToCloud(); closeModal(); render(); renderTicker();
  } else if(modalAction==="addReceivable"){
    const name=document.getElementById("r-name")?.value.trim();
    const total=parseFloat(document.getElementById("r-total")?.value);
    const nota=document.getElementById("r-nota")?.value||"";
    const venc=document.getElementById("r-venc")?.value||"";

    save("fin_receivables",receivables); syncToCloud(); showToast("Persona agregada ✓"); closeModal(); render();
  } else if(modalAction==="collectReceivable"){
    const amount=parseFloat(document.getElementById("r-pay")?.value);
    const r=receivables.find(r=>r.id===modalData.id);
    const remaining=r ? r.total-r.paid : 0;
    if(isNaN(amount)||amount<=0||amount>remaining+0.01){ showToast("Monto inválido","err"); return; }
    if(r){ r.paid=Math.min(r.paid+amount, r.total); r.cobros=r.cobros||[]; r.cobros.push({date:todayStr(),amount}); if(r.paid>=r.total) showToast("✅ ¡Cobrado por completo!"); else showToast(`Cobro de ${fmt(amount)} registrado ✓`); }
    save("fin_receivables",receivables); syncToCloud(); closeModal(); render();
  } else if(modalAction==="deleteReceivable"){
    receivables=receivables.filter(r=>r.id!==modalData.id); save("fin_receivables",receivables); syncToCloud();
    showToast("Persona eliminada","err"); closeModal(); render();
  } else if(modalAction==="addCategory"){
    const name=document.getElementById("c-name")?.value.trim();
    let icon=document.getElementById("c-icon")?.value.trim()||"🏷️";
    if(!name){ showToast("Escribe un nombre","err"); return; }
    const exists=[...CATS[toolsTab],...customCats[toolsTab].map(c=>c.name)].some(c=>c.toLowerCase()===name.toLowerCase());

    save("fin_custom_cats",customCats); syncToCloud();
    showToast(`Categoría "${name}" creada ✓`); closeModal(); render();
  } else if(modalAction==="deleteCategory"){
    customCats[toolsTab]=customCats[toolsTab].filter(c=>c.name!==modalData.name);
    save("fin_custom_cats",customCats); syncToCloud();
    showToast("Categoría eliminada","err"); closeModal(); render();
  }
}

// STATS
function getMonthlyStats(){
  const now=new Date();
  const months=[];
  for(let i=2;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=d.toISOString().slice(0,7);
    const mTx=transactions.filter(t=>t.fecha.startsWith(key));
    const inc=mTx.filter(t=>t.tipo==="ingreso").reduce((s,t)=>s+t.monto,0);
    const exp=mTx.filter(t=>t.tipo==="gasto").reduce((s,t)=>s+t.monto,0);
    months.push({key,inc,exp,balance:inc-exp});
  }
  return months;
}
function getForecast(){
  const stats=getMonthlyStats();
  const realMonths=stats.filter(m=>m.inc>0||m.exp>0);
  if(!realMonths.length) return null;
  const avgInc=realMonths.reduce((s,m)=>s+m.inc,0)/realMonths.length;
  const avgExp=realMonths.reduce((s,m)=>s+m.exp,0)/realMonths.length;
  const avgSave=avgInc-avgExp;
  const now=new Date();
  const forecast=[];
  let cumulative=0;
  for(let i=0;i<6;i++){ cumulative+=avgSave; forecast.push({month:monthLabel(i+1),projected:cumulative,monthly:avgSave}); }
  return {forecast,avgInc,avgExp,avgSave};
}

// ── RENDER ────────────────────────────────────────────────
function render(){
  const month=monthInput.value;
  const filtered=transactions.filter(t=>t.fecha.startsWith(month));
  const totalIn=filtered.filter(t=>t.tipo==="ingreso").reduce((s,t)=>s+t.monto,0);
  const totalOut=filtered.filter(t=>t.tipo==="gasto").reduce((s,t)=>s+t.monto,0);
  const totalDebtCalc=debts.filter(d=>d.paid>0).reduce((s,d)=>s+(d.total-d.paid),0);
  const balance=totalIn-totalOut-totalDebtCalc;
  const el=document.getElementById("content");
  if(currentView==="dashboard") renderDashboard(el,filtered,totalIn,totalOut,balance,totalDebtCalc);
  else if(currentView==="monthly") renderMonthlyDebts(el);
  else if(currentView==="add") renderAdd(el);
  else if(currentView==="savings") renderSavings(el);
  else if(currentView==="debts") renderDebts(el);
  else if(currentView==="tools") renderTools(el);
  else renderHistory(el,filtered);
}

function buildKaneDonut(entries,totalGasto,getStyle){
  const CX=150,CY=150,R=85,STROKE=22,GAP=5;
  const circumference=2*Math.PI*R;
  const top=entries.slice(0,4);
  const rest=entries.slice(4);
  const restVal=rest.reduce((s,[,v])=>s+v,0);
  const items=[...top];
  if(rest.length) items.push(["Otros",restVal]);
  const SLOT_ANGLES=[-135,-45,135,45,90];
  const SLOTS=[{x:36,y:74,align:"left"},{x:264,y:74,align:"right"},{x:36,y:232,align:"left"},{x:264,y:232,align:"right"},{x:150,y:272,align:"center"}];
  let cum=0, segs="", labels="";
  items.forEach(([cat,val],i)=>{
    const frac=val/totalGasto;
    const len=frac*circumference;
    const dash=Math.max(len-GAP,0);
    const offset=-cum;
    const style=getStyle(cat);
    segs+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${style.color}" stroke-width="${STROKE}" stroke-dasharray="${dash.toFixed(1)} ${(circumference-dash).toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${CX} ${CY})"/>`;
    cum+=len;
    const slot=SLOTS[i], ang=SLOT_ANGLES[i]*Math.PI/180;
    const lx1=CX+(R+STROKE/2+2)*Math.cos(ang), ly1=CY+(R+STROKE/2+2)*Math.sin(ang);
    const pct=Math.round(frac*100);
    const boxW=108,boxH=38;
    const bx=slot.align==="left"?slot.x:slot.align==="right"?slot.x-boxW:slot.x-boxW/2;
    const by=slot.y-boxH/2;
    const justify=slot.align==="left"?"flex-start":slot.align==="right"?"flex-end":"center";
    labels+=`<line x1="${lx1.toFixed(1)}" y1="${ly1.toFixed(1)}" x2="${slot.x}" y2="${slot.y}" stroke="#33334a" stroke-width="1.3"/>`;
    labels+=`<foreignObject x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${boxW}" height="${boxH}">

function setupAnimatedList(){
  const list=document.getElementById("debts-animated-list");
  if(!list) return;
  let focusIdx=-1;
  const cards=()=>Array.from(list.querySelectorAll(".debt-card"));
  list.addEventListener("keydown",e=>{
    const items=cards();
    if(!items.length) return;
    if(e.key==="ArrowDown"){ e.preventDefault(); focusIdx=Math.min(focusIdx+1,items.length-1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); focusIdx=Math.max(focusIdx-1,0); }
    else if(e.key==="Enter"&&focusIdx>=0){ items[focusIdx].click(); return; }
    else return;
    items.forEach(c=>c.classList.remove("list-focused"));
    items[focusIdx].classList.add("list-focused");
    items[focusIdx].scrollIntoView({block:"nearest",behavior:"smooth"});
  });
}

function toggleDebtCard(card){
  card.classList.remove('select-pulse'); void card.offsetWidth; card.classList.add('select-pulse');
  const isSelected = card.dataset.selected === "1";
  const checkbox = card.querySelector(".debt-checkbox");
  if(isSelected){
    card.dataset.selected = "0";
    card.style.border = `1px solid ${card.dataset.overdue==="1"?"#4a1a1a":card.dataset.soon==="1"?"#4a3010":"#2a2a3a"}`;
    checkbox.style.background = "transparent";
    checkbox.style.borderColor = "#333";
    checkbox.style.color = "transparent";
  } else {
    card.dataset.selected = "1";
    card.style.border = "2px solid #4ade80";
    checkbox.style.background = "#4ade80";
    checkbox.style.borderColor = "#4ade80";
    checkbox.style.color = "#000";
    checkbox.textContent = "✓";
    celebrateCheck(checkbox);
  }
  updateDebtSelection();
}

function celebrateCheck(checkbox){
  checkbox.classList.remove("checkbox-pop");
  void checkbox.offsetWidth; // reinicia la animación si se hace click rápido varias veces
  checkbox.classList.add("checkbox-pop");

  const rect = checkbox.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;

  const ring = document.createElement("div");
  ring.className = "check-ring";
  ring.style.left = cx+"px"; ring.style.top = cy+"px";
  document.body.appendChild(ring);
  setTimeout(()=>ring.remove(), 600);

  const bits = ["✨","💵","✨","💚","✨","💵","✨"];
  bits.forEach((emoji,i)=>{
    const angle = (Math.PI*2*i/bits.length) - Math.PI/2 + (Math.random()*0.6-0.3);
    const distance = 28 + Math.random()*26;
    const dx = Math.cos(angle)*distance;
    const dy = Math.sin(angle)*distance;
    const p = document.createElement("div");
    p.className = "check-particle";
    p.textContent = emoji;
    p.style.left = cx+"px"; p.style.top = cy+"px";
    p.style.setProperty("--dx", dx+"px");
    p.style.setProperty("--dy", dy+"px");
    p.style.animationDelay = (i*0.025)+"s";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 850);
  });
}

function clearDebtSelection(){
  document.querySelectorAll(".debt-card[data-selected='1']").forEach(c=>{
    c.dataset.selected="0";
    c.style.border=`1px solid #2a2a3a`;

}

function updateDebtSelection(){
  const cards=document.querySelectorAll(".debt-card[data-selected='1']");
  let count=cards.length, total=0;
  cards.forEach(c=>{ total+=parseFloat(c.dataset.remain||0); });
  const bar=document.getElementById("debt-selection-bar");
  if(count>0){
    bar.style.display="flex";
    document.getElementById("debt-selection-count").textContent=count+" deuda"+(count>1?"s":"")+" seleccionada"+(count>1?"s":"");
    document.getElementById("debt-selection-total").textContent=fmt(total);
  } else { bar.style.display="none"; }
}

function renderSavings(el){
  const fc=getForecast();
  const totalSaved=goals.reduce((s,g)=>s+(g.saved||0),0);
  let html=``;

  html+=`<div class="card" style="background:linear-gradient(135deg,#0a1a2a,#0d0f2a);border-color:#1a2a4a;animation-delay:0s">
    <div class="section-label" style="color:#4a6a8a">Previsión de ahorro — 6 meses</div>`;
  if(!fc){
    html+=`<div style="text-align:center;padding:20px 0;color:#444;font-size:14px"><div style="font-size:32px;margin-bottom:10px">📈</div>Registra ingresos y gastos para ver tu previsión.</div>`;
  } else {
    const maxP=Math.max(...fc.forecast.map(f=>Math.abs(f.projected)),1);
    html+=`<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
      <div><div style="font-size:11px;color:#4a6a8a;letter-spacing:.06em;margin-bottom:3px">AHORRO MENSUAL EST.</div><div style="font-size:26px;font-family:'DM Mono',monospace;font-weight:700;color:${fc.avgSave>=0?"#38bdf8":"#f87171"}">${fmt(fc.avgSave)}</div></div>
      <div style="text-align:right"><div style="font-size:11px;color:#4a6a8a;letter-spacing:.06em;margin-bottom:3px">EN 6 MESES</div><div style="font-size:20px;font-family:'DM Mono',monospace;font-weight:700;color:${fc.avgSave*6>=0?"#818cf8":"#f87171"}">${fmt(fc.avgSave*6)}</div></div>
    </div>
    <div class="forecast-bar-wrap">`;
    fc.forecast.forEach((f,i)=>{
      const h=Math.max(Math.round((Math.abs(f.projected)/maxP)*70),4);
      const color=f.projected>=0?`hsl(${210+i*8},80%,${50+i*3}%)`:"#f87171";
      html+=`<div class="forecast-bar-col"><div class="forecast-bar-val">${fmtShort(f.projected)}</div><div class="forecast-bar" style="height:${h}px;background:${color};opacity:${0.6+i*.07}"></div><div class="forecast-bar-label">${f.month}</div></div>`;
    });
    html+=`</div>`;
    const savePct=fc.avgInc>0?Math.round((fc.avgSave/fc.avgInc)*100):0;
    if(fc.avgSave>0){
      html+=`<div class="insight"><div class="insight-icon">💡</div><div class="insight-text">Ahorras <strong>${savePct}% de tus ingresos</strong> cada mes. En 6 meses tendrás <strong>${fmt(fc.avgSave*6)}</strong>.</div></div>`;
      if(savePct<20) html+=`<div class="insight"><div class="insight-icon">🎯</div><div class="insight-text">La regla 50/30/20 sugiere ahorrar al menos <strong>20%</strong>. Reducir <strong>${fmt((fc.avgInc*0.2)-fc.avgSave)}/mes</strong> en gastos te llevaría ahí.</div></div>`;
    } else if(fc.avgSave<0){
      html+=`<div class="insight" style="background:#1a0a0a;border-color:#4a1a1a"><div class="insight-icon">⚠️</div><div class="insight-text" style="color:#c49a8a">Tus gastos superan ingresos en <strong style="color:#f87171">${fmt(Math.abs(fc.avgSave))}/mes</strong>. Déficit de <strong style="color:#f87171">${fmt(Math.abs(fc.avgSave)*6)}</strong> en 6 meses.</div></div>`;
    }
  }
  html+=`</div>`;

  html+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;margin-top:4px">
    <div style="font-size:15px;font-weight:700">Metas de ahorro</div>
    <button onclick="openNewGoalModal()" style="background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700">+ Nueva meta</button>
  </div>`;

  if(goals.length===0){
    html+=`<div class="card"><div class="empty"><div class="empty-icon">🏦</div>Sin metas aún.<br><button onclick="openNewGoalModal()" style="margin-top:14px;background:#1e1e3a;border:1px solid #2a2a4a;color:#a78bfa;border-radius:9px;padding:9px 18px;font-size:13px;font-weight:600;">Crear primera meta</button></div></div>`;
  } else {
    goals.forEach((g,i)=>{
      const saved=g.saved||0;
      const pct=Math.min(Math.round((saved/g.target)*100),100);
      const remain=Math.max(g.target-saved,0);
      const done=saved>=g.target;
      let etaText="";
      if(fc&&fc.avgSave>0&&!done){ const months=Math.ceil(remain/fc.avgSave); etaText=`<span style="color:#38bdf8;font-size:11px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.2);padding:2px 7px;border-radius:5px;margin-left:6px">~${months} mes${months!==1?"es":""}</span>`; }
      else if(done){ etaText=`<span style="color:#4ade80;font-size:11px;background:rgba(74,222,128,.1);padding:2px 7px;border-radius:5px;margin-left:6px">✓ Completada</span>`; }
      html+=`<div class="goal-card" style="animation-delay:${.12+i*.06}s">
        <div class="goal-header"><div style="display:flex;align-items:center;gap:10px"><div style="font-size:26px">${g.emoji}</div><div><div class="goal-name">${esc(g.name)}${etaText}</div><div style="font-size:12px;color:#555;margin-top:2px">${pct}% completado</div></div></div><button class="goal-del-btn" onclick="askDeleteGoal(${g.id})">✕</button></div>
        <div class="goal-progress-track"><div class="goal-progress-fill" style="width:${pct}%;background:${done?"linear-gradient(90deg,#34d399,#4ade80)":"linear-gradient(90deg,#38bdf8,#818cf8)"}"></div></div>
        <div class="goal-amounts"><div><div style="font-size:10px;color:#555;margin-bottom:2px">AHORRADO</div><div class="goal-amount-val" style="color:#38bdf8">${fmt(saved)}</div></div><div style="text-align:right"><div style="font-size:10px;color:#555;margin-bottom:2px">META</div><div class="goal-amount-val">${fmt(g.target)}</div></div></div>
        <div class="goal-actions"><button class="goal-btn" onclick="openDepositModal(${g.id},false)">＋ Depositar</button>${saved>0?`<button class="goal-btn" style="color:#f87171;background:rgba(248,113,113,.07);border-color:#3a1a1a" onclick="openDepositModal(${g.id},true)">− Retirar</button>`:""}</div>
      </div>`;
    });
  }
  el.innerHTML=html;
}

function getCardsSummary(){
  const map={};
  bankRecords.forEach(r=>{
    const cuenta=r.cuenta||"Cuenta";
    if(!map[cuenta]) map[cuenta]={cuenta,gastado:0,cuotas:0};
    if(r.monto<0){
      const abs=Math.abs(r.monto);
      map[cuenta].gastado+=abs;
      if(/cuota|\b\d{1,2}\s*\/\s*\d{1,2}\b/i.test(r.descripcion||"")) map[cuenta].cuotas+=abs;
    }
  });
  bankAccounts.forEach(a=>{
    if(!map[a.cuenta]) map[a.cuenta]={cuenta:a.cuenta,gastado:0,cuotas:0};
    map[a.cuenta].banco=a.banco;
    map[a.cuenta].tipo=a.tipo;
    map[a.cuenta].numero=a.numero;
    map[a.cuenta].disponible=a.disponible;
    map[a.cuenta].cupo=a.cupo;
  });
  return Object.values(map).sort((a,b)=>(b.disponible||0)-(a.disponible||0)||b.gastado-a.gastado);
}

let reminderOn = load("fin_reminder", false);
let reminderChecked = load("fin_reminder_date", "");

function buildTickerText() {
  const pending = debts.filter(d => d.paid < d.total);
  if (!pending.length) return null;

  const today = todayStr();
  const overdue = pending.filter(d => d.vencimiento && d.vencimiento < today);
  const upcoming = pending.filter(d => d.vencimiento && d.vencimiento >= today && d.vencimiento <= new Date(Date.now()+7*864e5).toISOString().slice(0,10));
  const totalPending = pending.reduce((s,d) => s + (d.total - d.paid), 0);

  let items = [];
  if (overdue.length) items.push({ text:`⚠ ${overdue.length} deuda${overdue.length>1?"s":""} VENCIDA${overdue.length>1?"S":""}`, color:"#f87171", dot:"#f87171" });
  if (upcoming.length) upcoming.forEach(d => items.push({ text:`📅 ${d.name} vence ${fmtDate(d.vencimiento)}`, color:"#fb923c", dot:"#fb923c" }));
  pending.filter(d=>!d.vencimiento||(d.vencimiento>=today)).forEach(d => {
    const remain = d.total - d.paid;
    items.push({ text:`💳 ${d.name}: -${fmt(remain)}`, color: d.vencimiento&&d.vencimiento<today?"#f87171":"#fb923c", dot: d.vencimiento&&d.vencimiento<today?"#f87171":"#fb923c" });
  });
  items.push({ text:`📊 Total pendiente: ${fmt(totalPending)}`, color:"#a78bfa", dot:"#6366f1" });
  return { items, urgent: overdue.length > 0 };
}

function renderTicker() {
  const wrap = document.getElementById("ticker-wrap");
  const track = document.getElementById("ticker-track");
  const bell = document.getElementById("ticker-bell");

  bell.className = "ticker-bell " + (reminderOn ? "on" : "off");
  bell.title = reminderOn ? "Recordatorio activo — toca para desactivar" : "Activar recordatorio diario";

  const pending = debts.filter(d => d.paid < d.total);
  if (!pending.length) { wrap.classList.remove("visible","urgent"); return; }

  const data = buildTickerText();
  if (!data) { wrap.classList.remove("visible","urgent"); return; }

  wrap.classList.toggle("urgent", data.urgent);
  wrap.classList.add("visible");

  // Build doubled content for seamless loop
  const makeItems = () => data.items.map(item =>
    `<span class="ticker-item" style="color:${item.color}">
      <span class="ticker-dot" style="background:${item.dot}"></span>
      ${item.text}
      <span class="ticker-sep">·</span>
    </span>`
  ).join("");

  track.innerHTML = makeItems() + makeItems(); // doubled for seamless loop

  // Adjust animation speed based on content length
  const speed = Math.max(18, data.items.length * 7);
  track.style.animationDuration = speed + "s";
}

function toggleReminder() {
  reminderOn = !reminderOn;
  save("fin_reminder", reminderOn);

  if (reminderOn) {
    requestNotificationPermission();
    showToast("🔔 Recordatorio diario activado");
  } else {
    showToast("Recordatorio desactivado", "err");
  }
  renderTicker();
}

function requestNotificationPermission() {
  if (!("Notification" in window)) return;
  if (Notification.permission === "default") {
    Notification.requestPermission().then(perm => {
      if (perm === "granted") scheduleReminder();
    });
  } else if (Notification.permission === "granted") {
    scheduleReminder();
  }
}

function scheduleReminder() {
  // Fire immediately if first time today
  const today = todayStr();
  if (reminderChecked !== today && reminderOn) {
    save("fin_reminder_date", today);
    reminderChecked = today;
    setTimeout(fireReminder, 3000); // 3 seconds after enabling
  }
}

function fireReminder() {
  if (!reminderOn) return;
  const pending = debts.filter(d => d.paid < d.total);
  if (!pending.length) return;
  const totalPending = pending.reduce((s,d) => s+(d.total-d.paid), 0);
  const overdue = pending.filter(d => d.vencimiento && d.vencimiento < todayStr());

  if ("Notification" in window && Notification.permission === "granted") {
    new Notification("💳 Recordatorio de deudas", {
      body: `${pending.length} deuda${pending.length>1?"s":""} pendiente${pending.length>1?"s":""}. Total: ${fmt(totalPending)}` + (overdue.length ? ` · ⚠ ${overdue.length} vencida${overdue.length>1?"s":""}` : ""),
      icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a0f'/%3E%3Ctext x='50' y='62' text-anchor='middle' font-size='50'%3E💳%3C/text%3E%3C/svg%3E",
      badge: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23f97316'/%3E%3C/svg%3E",
      tag: "finanzas-deudas",
      requireInteraction: false
    });
  }
}

// Check reminder once per session
function checkDailyReminder() {
  if (!reminderOn) return;
  const today = todayStr();
  if (reminderChecked !== today) {
    save("fin_reminder_date", today);
    reminderChecked = today;
    if ("Notification" in window && Notification.permission === "granted") {
      setTimeout(fireReminder, 2000);
    }
  }
}

// FACE ID (WebAuthn — usa el sensor biométrico del dispositivo, disponible en Safari iOS 14+)
const FACEID_KEY="fin_faceid_cred";
function b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function unb64(str){ return Uint8Array.from(atob(str),c=>c.charCodeAt(0)); }

async function faceIDSupported(){
  try{ return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
  catch{ return false; }
}
async function initFaceIDUI(){
  if(!(await faceIDSupported())) return;
  if(localStorage.getItem(FACEID_KEY)) document.getElementById("faceid-btn").style.display="block";
  else document.getElementById("faceid-setup").style.display="block";
}
async function setupFaceID(){
  const val=document.getElementById("lock-input").value;
  if(val!==appPassword){ document.getElementById("lock-error").textContent="Ingresa tu contraseña primero para activar Face ID"; return; }
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:"Zynto"},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"usuario",displayName:"Usuario Zynto"},
      pubKeyCredParams:[{alg:-7,type:"public-key"},{alg:-257,type:"public-key"}],
      authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},
      timeout:60000
    }});
    localStorage.setItem(FACEID_KEY,b64(cred.rawId));
    document.getElementById("faceid-setup").style.display="none";
    document.getElementById("faceid-btn").style.display="block";
    document.getElementById("lock-error").textContent="";
    sessionStorage.setItem("fin_unlocked","1");
    document.getElementById("lock-screen").classList.add("hidden");
  }catch(e){
    document.getElementById("lock-error").textContent="No se pudo activar Face ID en este dispositivo";
  }
}
async function unlockWithFaceID(){
  const credId=localStorage.getItem(FACEID_KEY);
  if(!credId) return;
  try{
    await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{id:unb64(credId),type:"public-key"}],
      userVerification:"required",
      timeout:60000
    }});
    sessionStorage.setItem("fin_unlocked","1");
    document.getElementById("lock-screen").classList.add("hidden");
  }catch(e){
    document.getElementById("lock-error").textContent="Face ID no reconocido, usa tu contraseña";
  }
}

    // NUNCA subir en este caso — solo descargar lo que ya exista en la nube, para no arriesgar el respaldo real.

  const totalPending = pending.reduce((s,d)=>s+d.amount,0);
  const totalPaid = paid.reduce((s,d)=>s+d.amount,0);

  let html=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-weight:700;font-size:15px">Deudas del mes</div>
    <button onclick="openAddMonthlyModal()" style="background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer">+ Agregar</button>
  </div>

  <div style="display:flex;gap:9px;margin-bottom:14px">
    <div style="flex:1;background:#16161e;border:1px solid #2a2a3a;border-radius:14px;padding:12px;text-align:center">
      <div style="font-size:10px;color:#f59e0b;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;font-weight:600">POR PAGAR</div>
      <div style="font-family:monospace;font-size:17px;font-weight:700;color:#f59e0b">${fmt(totalPending)}</div>
      <div style="font-size:11px;color:#555;margin-top:2px">${pending.length} ítem${pending.length!==1?"s":""}</div>
    </div>
    <div style="flex:1;background:#16161e;border:1px solid #2a2a3a;border-radius:14px;padding:12px;text-align:center">
      <div style="font-size:10px;color:#4ade80;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;font-weight:600">PAGADAS</div>
      <div style="font-family:monospace;font-size:17px;font-weight:700;color:#4ade80">${fmt(totalPaid)}</div>
      <div style="font-size:11px;color:#555;margin-top:2px">${paid.length} ítem${paid.length!==1?"s":""}</div>
    </div>
    <div style="flex:1;background:#16161e;border:1px solid #2a2a3a;border-radius:14px;padding:12px;text-align:center">
      <div style="font-size:10px;color:#888;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;font-weight:600">TOTAL</div>
      <div style="font-family:monospace;font-size:17px;font-weight:700">${fmt(total)}</div>
      <div style="font-size:11px;color:#555;margin-top:2px">${monthlyDebts.length} ítem${monthlyDebts.length!==1?"s":""}</div>
    </div>
  </div>`;

  if(monthlyDebts.length===0){
    html+=`<div style="background:#16161e;border:1px solid #2a2a3a;border-radius:16px;padding:36px 20px;text-align:center;color:#444">
      <div style="font-size:40px;margin-bottom:12px">📅</div>
      Sin deudas del mes registradas.
      <br><button onclick="openAddMonthlyModal()" style="margin-top:14px;background:#2a1a00;border:1px solid #4a3010;color:#f59e0b;border-radius:9px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer">Agregar primera</button>
    </div>`;
  } else {
    // Pending
    if(pending.length>0){
      html+=`<div style="font-size:11px;color:#555;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;font-weight:600">POR PAGAR</div>`;
      pending.forEach((d,i)=>{
        html+=`<div class="monthly-stack-card" style="position:sticky;top:${70+i*20}px;z-index:${i+1};background:#16161e;border:1px solid #2a2a3a;border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;animation:slideUp .25s ${i*.04}s cubic-bezier(.22,1,.36,1) both">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.name)}</div>
            <div style="font-size:12px;color:#555;margin-top:3px">📅 ${d.categoria||"Otro"}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-family:monospace;font-weight:700;font-size:17px;color:#f59e0b">${fmt(d.amount)}</div>
            <div style="display:flex;gap:6px;margin-top:6px;justify-content:flex-end">
              <button onclick="markMonthlyPaid(${d.id})" style="background:linear-gradient(135deg,#4ade80,#22c55e);color:#000;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer">✓ Pagado</button>
              <button onclick="deleteMonthlyDebt(${d.id})" style="background:#1e1e2e;color:#555;border:1px solid #2a2a3a;border-radius:8px;padding:6px 8px;font-size:14px;cursor:pointer">✕</button>
            </div>
          </div>
        </div>`;
      });
    }
    // Paid
    if(paid.length>0){
      html+=`<div style="font-size:11px;color:#555;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px;font-weight:600">PAGADAS ✓</div>`;
      paid.forEach((d,i)=>{
        html+=`<div style="background:#0d160d;border:1px solid #1a3020;border-radius:14px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;opacity:.7">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:14px;color:#4ade80;text-decoration:line-through;text-decoration-color:#2a5a2a">${esc(d.name)}</div>
            <div style="font-size:12px;color:#3a6a3a;margin-top:2px">${d.categoria||"Otro"}</div>
          </div>
          <div style="font-family:monospace;font-size:15px;color:#4ade80">${fmt(d.amount)}</div>
          <button onclick="deleteMonthlyDebt(${d.id})" style="background:none;border:none;color:#333;font-size:16px;cursor:pointer">✕</button>
        </div>`;
      });
    }
  }
  el.innerHTML = html;
  setupMonthlyScrollStack();
}

function setupMonthlyScrollStack(){
  const container=document.getElementById("content");
  const cards=Array.from(container.querySelectorAll(".monthly-stack-card"));
  if(!cards.length) return;
  function update(){
    for(let i=0;i<cards.length-1;i++){
      const a=cards[i].getBoundingClientRect();
      const b=cards[i+1].getBoundingClientRect();
      const overlap=a.bottom-b.top;
      if(overlap>0){
        const p=Math.min(1,overlap/60);
        cards[i].style.transform=`scale(${1-p*0.04})`;
        cards[i].style.filter=`blur(${(p*1.5).toFixed(2)}px)`;
        cards[i].style.opacity=`${1-p*0.15}`;
      } else {
        cards[i].style.transform="";
        cards[i].style.filter="";
        cards[i].style.opacity="";
      }
    }
  }
  container.addEventListener("scroll",()=>requestAnimationFrame(update),{passive:true});
  update();
}

function openAddMonthlyModal(){
  openModal("Nueva deuda del mes",
    `<div class="modal-row"><label class="form-label">Nombre</label><input id="md-name" class="form-input" placeholder="Ej: Gastos comunes, Netflix…"/></div>
    <div class="modal-row"><label class="form-label">Monto ($)</label><input id="md-amount" class="form-input" type="number" min="1" step="1" placeholder="0" style="font-family:monospace;font-size:18px"/></div>
    <div class="modal-row"><label class="form-label">Categoría</label><select id="md-cat" class="form-input" style="color:#ccc">${MONTHLY_CATS.map(c=>`<option>${c}</option>`).join("")}</select></div>`,
    "Agregar","primary","addMonthlyDebt",{}
  );
}

function markMonthlyPaid(id){
  monthlyDebts = monthlyDebts.map(d=>d.id===id?{...d,pagado:true}:d);
  save("fin_monthly_debts",monthlyDebts); syncToCloud();
  showToast("✓ Marcado como pagado");
  renderMonthlyDebts(document.getElementById("content"));
}

function deleteMonthlyDebt(id){
  monthlyDebts = monthlyDebts.filter(d=>d.id!==id);
  save("fin_monthly_debts",monthlyDebts); syncToCloud();
  showToast("Eliminado","err");
  renderMonthlyDebts(document.getElementById("content"));
}

// ===== FONDO DE PARTÍCULAS BRILLANTES CON TOUCH =====
(function(){
  const canvas=document.getElementById('bg-particles');
  const ctx=canvas.getContext('2d');
  let W,H,particles=[];
  const N=70;
  const pointer={x:-9999,y:-9999,active:false};
  function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
  resize(); addEventListener('resize',resize);
  function rnd(a,b){ return a+Math.random()*(b-a); }
  function makeParticle(){
    return { x:rnd(0,W), y:rnd(0,H), ox:0, oy:0, r:rnd(.6,2.2), vx:rnd(-.08,.08), vy:rnd(-.08,.08), a:rnd(.25,.85), tw:rnd(0,Math.PI*2) };
  }
  for(let i=0;i<N;i++) particles.push(makeParticle());
  function setPointer(x,y){ pointer.x=x; pointer.y=y; pointer.active=true; }
  function clearPointer(){ pointer.active=false; }
  window.addEventListener('pointermove',e=>setPointer(e.clientX,e.clientY),{passive:true});
  window.addEventListener('pointerdown',e=>setPointer(e.clientX,e.clientY),{passive:true});
  window.addEventListener('touchmove',e=>{ if(e.touches[0]) setPointer(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
  window.addEventListener('pointerleave',clearPointer,{passive:true});
  window.addEventListener('touchend',clearPointer,{passive:true});
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(const p of particles){
      p.x+=p.vx; p.y+=p.vy; p.tw+=.02;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      if(pointer.active){
        const dx=p.x-pointer.x, dy=p.y-pointer.y;
        const dist=Math.hypot(dx,dy), rad=110;
        if(dist<rad && dist>0.001){
          const f=(rad-dist)/rad*2.2;
          p.ox+=(dx/dist)*f; p.oy+=(dy/dist)*f;
        }
      }
      p.ox*=.9; p.oy*=.9;
      const drawX=p.x+p.ox, drawY=p.y+p.oy;
      const flicker=.5+.5*Math.sin(p.tw);
      ctx.beginPath();
      ctx.arc(drawX,drawY,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(167,139,250,${(p.a*flicker*0.9).toFixed(3)})`;
      ctx.shadowColor='rgba(167,139,250,.9)';
      ctx.shadowBlur=6;
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
